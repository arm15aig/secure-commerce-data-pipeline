name: Secure Data Pipeline CI/CD

# 🎯 Trigger this pipeline on every push or pull request targeting our core branches
on:
  push:
    branches: [ main, master, dev, 'feature/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 🧪 JOB 1: Verify the Python Data Processing Layer
  test-python-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Cloud Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Ingestion Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install boto3

    - name: Execute Core Logic Unit Test Suite
      run: |
        python -m unittest discover -s tests

  # 🏗️ JOB 2: Verify the TypeScript Infrastructure as Code Layer
  test-infrastructure-stack:
    runs-on: ubuntu-latest
    needs: test-python-pipeline # Only run this job if our Python unit tests pass completely!
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Cloud Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Infrastructure Tooling & Type Definitions
      working-directory: ./infra
      run: |
        npm ci

    - name: Execute AWS CDK Architectural Synthesis Test
      working-directory: ./infra
      run: |
        npx cdk synth